openapi: 3.0.1
info:
  title: WalletSystem.Api
  description: |
    A RESTful API for managing user accounts, multiple wallets, and transactions.
    
    ## Features
    - User registration and login with JWT authentication
    - Multiple wallets per account with different currencies
    - Deposits, withdrawals, and transfers between wallets
    - Transaction history tracking
    - Pessimistic locking for transactional integrity
    
    ## Authentication
    Most endpoints require a JWT token obtained from the `/api/auth/login` endpoint.
    Include the token in the Authorization header as `Bearer {token}`.
  version: '1.0'
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserCommand'
          text/json:
            schema:
              $ref: '#/components/schemas/RegisterUserCommand'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RegisterUserCommand'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/RegisterUserResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterUserResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/RegisterUserResponse'
  /api/auth/login:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCommand'
          text/json:
            schema:
              $ref: '#/components/schemas/LoginCommand'
          application/*+json:
            schema:
              $ref: '#/components/schemas/LoginCommand'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LoginResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /api/auth/me:
    get:
      tags:
        - Auth
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GetCurrentUserResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/GetCurrentUserResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/GetCurrentUserResponse'
  /api/auth/refresh:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenCommand'
          text/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenCommand'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RefreshTokenCommand'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
  /api/health:
    get:
      tags:
        - Health
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
  /api/health/live:
    get:
      tags:
        - Health
      responses:
        '200':
          description: OK
  /api/health/ready:
    get:
      tags:
        - Health
      responses:
        '200':
          description: OK
  /api/transactions/deposit:
    post:
      tags:
        - Transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositCommand'
          text/json:
            schema:
              $ref: '#/components/schemas/DepositCommand'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DepositCommand'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
  /api/transactions/withdraw:
    post:
      tags:
        - Transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawCommand'
          text/json:
            schema:
              $ref: '#/components/schemas/WithdrawCommand'
          application/*+json:
            schema:
              $ref: '#/components/schemas/WithdrawCommand'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
  /api/transactions/transfer:
    post:
      tags:
        - Transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferCommand'
          text/json:
            schema:
              $ref: '#/components/schemas/TransferCommand'
          application/*+json:
            schema:
              $ref: '#/components/schemas/TransferCommand'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
  '/api/transactions/wallet/{walletId}':
    get:
      tags:
        - Transactions
      parameters:
        - name: walletId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionDto'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionDto'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionDto'
  '/api/transactions/{id}':
    get:
      tags:
        - Transactions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TransactionDto'
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDto'
            text/json:
              schema:
                $ref: '#/components/schemas/TransactionDto'
  /:
    get:
      tags:
        - WalletSystem.Api
      responses:
        '200':
          description: OK
  /api/wallets:
    post:
      tags:
        - Wallets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWalletCommand'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateWalletCommand'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateWalletCommand'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CreateWalletResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWalletResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/CreateWalletResponse'
    get:
      tags:
        - Wallets
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletDto'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletDto'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletDto'
  '/api/wallets/{id}':
    get:
      tags:
        - Wallets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/WalletDto'
            application/json:
              schema:
                $ref: '#/components/schemas/WalletDto'
            text/json:
              schema:
                $ref: '#/components/schemas/WalletDto'
components:
  schemas:
    CreateWalletCommand:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        currency:
          type: string
          nullable: true
      additionalProperties: false
    CreateWalletResponse:
      type: object
      properties:
        walletId:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        currency:
          type: string
          nullable: true
        balance:
          type: number
          format: double
        message:
          type: string
          nullable: true
      additionalProperties: false
    DepositCommand:
      type: object
      properties:
        walletId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        description:
          type: string
          nullable: true
        reference:
          type: string
          nullable: true
      additionalProperties: false
    GetCurrentUserResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
      additionalProperties: false
    HealthCheckResponse:
      type: object
      properties:
        overallStatus:
          $ref: '#/components/schemas/ServiceHealthStatus'
        services:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ServiceHealth'
          nullable: true
        timestamp:
          type: string
          format: date-time
      additionalProperties: false
    LoginCommand:
      type: object
      properties:
        email:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
      additionalProperties: false
    LoginResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        token:
          type: string
          nullable: true
        refreshToken:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    RefreshTokenCommand:
      type: object
      properties:
        refreshToken:
          type: string
          nullable: true
        accessToken:
          type: string
          nullable: true
      additionalProperties: false
    RefreshTokenResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        newAccessToken:
          type: string
          nullable: true
        newRefreshToken:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    RegisterUserCommand:
      type: object
      properties:
        email:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
      additionalProperties: false
    RegisterUserResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
      additionalProperties: false
    ServiceHealth:
      type: object
      properties:
        name:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ServiceHealthStatus'
        description:
          type: string
          nullable: true
        responseTime:
          type: string
          format: date-span
          nullable: true
        checkedAt:
          type: string
          format: date-time
      additionalProperties: false
    ServiceHealthStatus:
      enum:
        - 0
        - 1
        - 2
      type: integer
      format: int32
    TransactionDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          nullable: true
        amount:
          type: number
          format: double
        description:
          type: string
          nullable: true
        walletId:
          type: string
          format: uuid
        relatedWalletId:
          type: string
          format: uuid
          nullable: true
        reference:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        isCompleted:
          type: boolean
      additionalProperties: false
    TransactionResponse:
      type: object
      properties:
        transactionId:
          type: string
          format: uuid
        type:
          type: string
          nullable: true
        amount:
          type: number
          format: double
        newBalance:
          type: number
          format: double
        message:
          type: string
          nullable: true
      additionalProperties: false
    TransferCommand:
      type: object
      properties:
        fromWalletId:
          type: string
          format: uuid
        toWalletId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        description:
          type: string
          nullable: true
        reference:
          type: string
          nullable: true
      additionalProperties: false
    WalletDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        currency:
          type: string
          nullable: true
        balance:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        lastTransactionAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    WithdrawCommand:
      type: object
      properties:
        walletId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        description:
          type: string
          nullable: true
        reference:
          type: string
          nullable: true
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: JWT Authorization header using the Bearer scheme. Enter your token in the text input below.
      scheme: Bearer
      bearerFormat: JWT
security:
  - Bearer: [ ]