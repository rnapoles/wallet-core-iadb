# TaskForge frontend — serves the Vite bundle and forwards API calls to the
# backend container, so the browser only ever talks to one origin.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript image/svg+xml;

    # Reverse proxy: every /api/* call lands on the .NET service.
    location /api/v1/ {

        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security headers
        include /etc/nginx/conf.d/security-headers.conf;

    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri /index.html;

        # Security headers
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable cache for HTML files
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # Security headers
        include /etc/nginx/conf.d/security-headers.conf;
    }

}




